<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enerji Yönetim Platformu</title>
<meta name="description" content="Aylık enerji ve üretim verilerini izleyen, ISO 50001 yaklaşımını destekleyen tek dosyalık enerji yönetim platformu.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

/* Enerji Yönetim Platformu — görsel dil (El Kitabı 5.7)
   Renk paleti bağlayıcıdır. Koyu tema AYRI SEÇİLMİŞTİR, otomatik ters çevirme değildir. */

:root{
  color-scheme: light;
  /* zemin ve mürekkep (5.7.1) */
  --sayfa:        #f9f9f7;
  --yuzey:        #fcfcfb;
  --yuzey-2:      #f2f1ed;
  --ink:          #0b0b0b;
  --ink-2:        #52514e;
  --ink-mut:      #898781;
  --kilavuz:      #e1e0d9;
  --taban:        #c3c2b7;
  --cerceve:      rgba(11,11,11,.10);
  /* kategorik slotlar — SIRA DEĞİŞMEZ */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  /* durum — asla seri rengi olarak kullanılmaz */
  --iyi:#0ca30c; --uyari:#fab219; --ciddi:#ec835a; --kritik:#d03b3b;
  --iyi-ink:#006300;
  /* sıralı ramp (ısı haritası) */
  --r100:#cde2fb; --r250:#86b6ef; --r400:#3987e5; --r550:#1c5cab; --r700:#0d366b;
  --notr:#f0efec;
  --r:6px; --gecis:.15s ease;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-tema="acik"])){
    color-scheme: dark;
    --sayfa:#0d0d0d; --yuzey:#1a1a19; --yuzey-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-mut:#898781;
    --kilavuz:#2c2c2a; --taban:#383835; --cerceve:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --iyi-ink:#0ca30c; --notr:#383835;
  }
}
:root[data-tema="koyu"]{
  color-scheme: dark;
  --sayfa:#0d0d0d; --yuzey:#1a1a19; --yuzey-2:#232322;
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-mut:#898781;
  --kilavuz:#2c2c2a; --taban:#383835; --cerceve:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --iyi-ink:#0ca30c; --notr:#383835;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sayfa); color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0 0 .5em; font-weight:600; line-height:1.25}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px}
p{margin:0 0 .75em}
a{color:var(--s1)}
code,.tek{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92em}
.sayi{font-variant-numeric:tabular-nums}

/* ---------- yerleşim ---------- */
#uyg{display:grid;grid-template-columns:232px 1fr;height:100vh;overflow:hidden}
@media(max-width:860px){#uyg{grid-template-columns:1fr}#menu{display:none}}

#menu{
  background:var(--yuzey); border-right:1px solid var(--cerceve);
  overflow-y:auto; padding:14px 0 24px;
}
.marka{padding:4px 16px 14px;border-bottom:1px solid var(--cerceve);margin-bottom:10px}
.marka b{display:block;font-size:13px;letter-spacing:.01em}
.marka span{display:block;font-size:11px;color:var(--ink-mut);margin-top:2px}
.menu-grup{
  padding:14px 16px 5px;font-size:10px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-mut);
}
.menu-og{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 16px;border:0;background:none;color:var(--ink-2);
  font:inherit;text-align:left;cursor:pointer;transition:background var(--gecis);
  border-left:3px solid transparent;
}
.menu-og:hover{background:var(--yuzey-2);color:var(--ink)}
.menu-og[aria-current="page"]{
  background:var(--yuzey-2);color:var(--ink);font-weight:600;border-left-color:var(--s1);
}
.menu-og .no{
  flex:0 0 19px;text-align:center;font-size:10px;color:var(--ink-mut);
  font-variant-numeric:tabular-nums;
}
.menu-og[data-hazir="0"]{opacity:.42}
.menu-og[data-hazir="0"]::after{content:"•";margin-left:auto;color:var(--ink-mut);font-size:16px}

/* ---------- üst şerit ---------- */
#govde{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#serit{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 20px;background:var(--yuzey);border-bottom:1px solid var(--cerceve);
}
#serit .bosluk{flex:1}
#icerik{flex:1;overflow-y:auto;padding:22px 24px 64px}
.sayfa-basi{margin-bottom:18px}
.sayfa-basi p{color:var(--ink-2);max-width:70ch;margin:0}

/* ---------- bileşenler ---------- */
button,select,input,textarea{font:inherit;color:inherit}
.dugme{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border:1px solid var(--taban);border-radius:var(--r);
  background:var(--yuzey);cursor:pointer;transition:all var(--gecis);white-space:nowrap;
}
.dugme:hover{background:var(--yuzey-2);border-color:var(--ink-mut)}
.dugme.ana{background:var(--s1);border-color:var(--s1);color:#fff}
.dugme.ana:hover{filter:brightness(1.08)}
.dugme.tehlike{border-color:var(--kritik);color:var(--kritik)}
.dugme.tehlike:hover{background:var(--kritik);color:#fff}
.dugme:disabled{opacity:.45;cursor:not-allowed}
.dugme.kucuk{padding:3px 8px;font-size:12px}

input[type=text],input[type=number],input[type=date],select,textarea{
  padding:6px 9px;border:1px solid var(--taban);border-radius:var(--r);
  background:var(--yuzey);max-width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--s1);outline-offset:-1px;border-color:var(--s1)}
label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:3px}
.alan{margin-bottom:12px}
.satir{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}

.kart{
  background:var(--yuzey);border:1px solid var(--cerceve);border-radius:10px;
  padding:16px 18px;margin-bottom:16px;
}
.kart>h2:first-child,.kart>h3:first-child{margin-top:0}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--kilavuz)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mut);font-weight:600;
   position:sticky;top:0;background:var(--yuzey);z-index:1}
td.s,th.s{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--yuzey-2)}
.tablo-sar{overflow:auto;max-height:65vh;border:1px solid var(--cerceve);border-radius:8px;background:var(--yuzey)}

/* uyarı — sonucun yanında durur (E-2) */
.uyari{
  display:flex;gap:9px;align-items:flex-start;
  padding:9px 13px;border-radius:var(--r);margin-bottom:12px;font-size:13px;
  border:1px solid var(--cerceve);background:var(--yuzey);
}
.uyari .ikon{flex:0 0 auto;font-size:14px;line-height:1.35}
.uyari.bilgi{border-left:3px solid var(--s1)}
.uyari.iyi{border-left:3px solid var(--iyi)}
.uyari.dikkat{border-left:3px solid var(--uyari)}
.uyari.ciddi{border-left:3px solid var(--ciddi)}
.uyari.kritik{border-left:3px solid var(--kritik)}

.rozet{
  display:inline-flex;align-items:center;gap:4px;
  padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;
  border:1px solid var(--cerceve);background:var(--yuzey-2);color:var(--ink-2);
}
.rozet.iyi{color:var(--iyi-ink);border-color:var(--iyi)}
.rozet.dikkat{color:var(--ciddi);border-color:var(--uyari)}
.rozet.kritik{color:var(--kritik);border-color:var(--kritik)}

.sessiz{color:var(--ink-mut)}
.kucuk{font-size:12px}
.mini{font-size:11px}

/* boş durum öğreticidir (E-5) */
.bos{
  text-align:center;padding:56px 24px;color:var(--ink-2);
  border:1px dashed var(--taban);border-radius:10px;background:var(--yuzey);
}
.bos h3{color:var(--ink)}
.bos p{max-width:52ch;margin:0 auto .75em}

/* sekmeler */
.sekmeler{display:flex;gap:2px;border-bottom:1px solid var(--cerceve);margin-bottom:18px;overflow-x:auto}
.sekme{
  padding:8px 14px;border:0;background:none;color:var(--ink-2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}
.sekme:hover{color:var(--ink)}
.sekme[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--s1)}

/* ağaç */
.agac{list-style:none;margin:0;padding:0}
.agac ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--kilavuz)}
.agac li{margin:1px 0}
.dugum{
  display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--r);
  cursor:pointer;transition:background var(--gecis);
}
.dugum:hover{background:var(--yuzey-2)}
.dugum.secili{background:var(--yuzey-2);outline:1px solid var(--s1)}
.dugum .tip{font-size:10px;color:var(--ink-mut);text-transform:uppercase;letter-spacing:.05em}
.dugum.pasif{opacity:.5}

/* modal */
.ortu{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;
      align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--yuzey);border-radius:12px;padding:22px;max-width:620px;width:100%;
       max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.28)}

/* yazdırma */
@media print{
  #menu,#serit,.dugme,.sekmeler{display:none!important}
  #uyg{display:block;height:auto}#icerik{overflow:visible;padding:0}
  body{background:#fff;color:#000}
  .kart{border:1px solid #ccc;break-inside:avoid}
}

/* izlenebilirlik düğmesi (E-4) */
.koken{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;margin-left:5px;padding:0;
  font-size:10px;font-weight:700;line-height:1;
  color:var(--ink-mut);background:transparent;
  border:1px solid var(--kilavuz);border-radius:50%;cursor:pointer;
  vertical-align:middle;
}
.koken:hover{color:var(--s1);border-color:var(--s1)}

/* hedef ölçeri (9.13 G2) */
.olcer{position:relative;height:10px;border-radius:5px;background:var(--kilavuz);overflow:visible}
.olcer .dolgu{position:absolute;inset:0 auto 0 0;border-radius:5px}
.olcer .isaret{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--taban)}

/* rapor: yazdırma dostu tek sütun */
.rapor{max-width:860px}
.rapor h2{margin-top:22px}
.rapor .kart{break-inside:avoid}
@media print{
  .rapor{max-width:none}
  .koken{display:none!important}
}

</style>

  const verim = yakit ? faydali / yakit : null;

  // BENZER KÜME: iki dönemde de çalışan ekipmanlar. Karşılaştırma yalnız
  // bunlar üzerinden yapılır — yoksa ekipman kümesinin değişmesi, verim
  // değişmiş gibi okunur. 2025'te gaz motorları durdu; karma toplam bu
  // yüzden "iyileşmiş" görünür, oysa çalışan ekipmanın verimi düşmüştür.
  const ortak = hepsi.filter(r => r.s && r.so && r.s.toplamVerim != null && r.so.toplamVerim != null);

  const giren = hepsi.filter(r => r.s && !r.so).map(r => r.ad);
  const cikan = hepsi.filter(r => !r.s && r.so).map(r => r.ad);

  const kutu = (ad, v, birim, alt) => el("div.kart", { stil:{ flex:"1 1 190px", margin:"0" } },
    el("div.mini.sessiz", { metin:ad }),
    el("div", { stil:{ fontSize:"21px", fontWeight:"600", margin:"4px 0 2px",
      fontVariantNumeric:"tabular-nums" } }, v,
      el("span", { stil:{ fontSize:"12px", fontWeight:"400", color:"var(--ink-mut)",
        marginLeft:"5px" }, metin:birim })),
    alt ? el("div.mini.sessiz", { metin:alt }) : null);

  k.append(el("div.satir", { stil:{ marginBottom:"14px" } },
    kutu("Yakıt girdisi", say(yakit, 0), "kWh", `${calisan.length} çalışan ekipman · ${secilenYil}`),
    kutu("Faydalı enerji", say(faydali, 0), "kWh", "elektrik + buhar + sıcak su"),
    kutu("Toplam verim (bu yılın kümesi)", verim === null ? "—" : yuzde(verim * 100, 1), "",
      calisan.some(r => r.s.imkansiz)
        ? "⚠ tutarsız veri içeriyor — aşağıdaki uyarıyı okumadan kullanılamaz"
        : "farklı ekipman tiplerinin karışımı — yıllar arası kıyaslanmaz"),
    kutu("Dönüşüm kaybı", say(yakit - faydali, 0), "kWh",
      verim === null ? "" : yuzde((1 - verim) * 100, 1))));

  // Ekipman kümesi değiştiyse karma toplamın yıllar arası okunması YANLIŞTIR.
  if (giren.length || cikan.length)
    k.append(uyari("dikkat",
      el("b", { metin:`Ekipman kümesi ${secilenYil - 1} ile ${secilenYil} arasında değişti. ` }),
      (cikan.length ? `Devreden çıkan: ${cikan.join(", ")}. ` : "") +
      (giren.length ? `Devreye giren: ${giren.join(", ")}. ` : "") +
      "Kazanın verimi türbinin veriminden yapısal olarak yüksektir; küme değişince " +
      "karma toplam, hiçbir ekipmanın verimi değişmese bile oynar. Bu yüzden yıllar " +
      "arası karşılaştırma aşağıda yalnız iki yılda da çalışan ekipmanlar üzerinden yapılır."));

  // TEK BİR BİRLEŞİK VERİM YÜZDESİ YILLAR ARASI KIYASLANMAZ.
  // Aynı ekipman kümesinde bile yükün ekipmanlar arasında dağılımı değişir:
  // kazanın verimi türbinden yüksek olduğu için yük kazana kaydığında
  // ağırlıklı ortalama YÜKSELİR, her ekipmanın kendi verimi düşse bile.
  // Bu yüzden karşılaştırma ekipman ekipman yapılır ve toplanan şey yüzde
  // değil, KAÇINILABİLİR YAKITTIR (kWh) — bu büyüklük karışımdan bağımsızdır.
  // İMKÂNSIZ VERİM: faydalı enerji yakıttan büyük. Performans olarak
  // okunamaz; karşılaştırmadan çıkarılır ve nedeni açıkça söylenir.
  const imkansiz = hepsi.filter(r => r.s?.imkansiz || r.so?.imkansiz);
  if (imkansiz.length) tutarsizlikUyarisi(k, imkansiz, hepsi);
  atanmamisUyarisi(k);

  const saglam = ortak.filter(r => !r.s.imkansiz && !r.so.imkansiz);
  if (saglam.length) {
    const kotu = saglam.filter(r => r.puanFark < -0.5);
    const iyi  = saglam.filter(r => r.puanFark > 0.5);
    const kacinilabilir = saglam.reduce((t2, r) =>
      t2 + (r.so.toplamVerim - r.s.toplamVerim) * r.s.yakit, 0);
    const fy = yakitFiyatiKwh(saglam[0].noktalar.yakit.enerji_turu, yilDonemleri(secilenYil));
    const tur = kacinilabilir > 0 ? (kotu.length === saglam.length ? "ciddi" : "dikkat")
              : kacinilabilir < 0 ? "iyi" : "bilgi";
    k.append(uyari(tur,
      el("b", { metin: saglam.length === 1
        ? `İki yılda da çalışan ve verisi tutarlı tek ekipman ${saglam[0].ad}: ` +
          `verim ${kotu.length ? "düştü" : iyi.length ? "iyileşti" : "değişmedi"}. `
        : `İki yılda da çalışan ve verisi tutarlı ${saglam.length} ekipmandan ` +
          `${kotu.length} tanesinde verim düştü, ${iyi.length} tanesinde iyileşti. ` }),
      (kacinilabilir > 0
        ? `${secilenYil - 1} verimleri korunsaydı ${say(kacinilabilir, 0)} kWh yakıt ` +
          "yakılmayacaktı"
        : kacinilabilir < 0
        ? `${secilenYil - 1} verimleriyle ${say(Math.abs(kacinilabilir), 0)} kWh daha fazla ` +
          "yakıt gerekecekti"
        : "yakıt karşılığı değişmedi") +
      (fy && kacinilabilir ? ` ≈ ${say(Math.abs(kacinilabilir) * fy.fiyat, 0)} TL` : "") + ". " +
      "Bu sayı her ekipmanın kendi yakıtı üzerinden toplanır. Tek bir birleşik " +
      "verim yüzdesi yıllar arası okunamaz, çünkü yük ekipmanlar arasında yer değiştirdikçe " +
      "hiçbir ekipmanın verimi değişmese bile oynar. Ekipman ekipman fark aşağıdaki kartlarda." +
      (imkansiz.length ? ` Verisi tutarsız ${imkansiz.length} ekipman bu toplama girmedi.` : "")));
  } else {
    k.append(uyari("dikkat",
      el("b", { metin:"Yıllar arası verim karşılaştırması yapılamıyor. " }),
      ortak.length
        ? `${secilenYil - 1} ve ${secilenYil} yıllarında birlikte çalışan ekipmanların ` +
          "hepsinde veri tutarsız (faydalı enerji yakıttan büyük). Karşılaştırma, veri " +
          "düzeltilmeden anlam taşımaz."
        : `${secilenYil - 1} ve ${secilenYil} yıllarında birlikte çalışan hiçbir ekipman yok.`));
  }

  katsayiUyarisi(k, ortak.length ? ortak : calisan);

  k.append(uyari("bilgi",
    el("b", { metin:"Bu ekranın sayıları fabrika toplam enerjisine eklenmez. " }),
    "Dönüşüm ekipmanlarının yakıtı istasyon ölçümünün alt kırılımıdır, ürettikleri " +
    "elektrik ve buhar ise ara enerjidir (7.1). Burada ölçülen tek şey, aynı yakıttan " +
    "ne kadar faydalı enerji çıkarıldığıdır."));
}

/* ----------------------------------------------------------- kartlar */
function kartlar(k, satirlar) {
  const g = el("div", { stil:{ display:"grid", gap:"12px",
    gridTemplateColumns:"repeat(auto-fill, minmax(330px, 1fr))", marginBottom:"14px" } });

  for (const r of satirlar) {
    const kart = el("div.kart", { stil:{ margin:"0" } });
    const v = r.varlik;
    const durumEtiketi = v.devreden_cikis
      ? el("span.rozet.dikkat", { metin:`durduruldu · ${v.devreden_cikis}` })
      : r.s ? el("span.rozet", { metin:`çalışıyor · ${r.s.calisan} ay` })
            : el("span.rozet.dikkat", { metin:"bu yıl veri yok" });
    kart.append(el("div.satir", { stil:{ justifyContent:"space-between", alignItems:"baseline" } },
      el("h3", { stil:{ margin:"0" }, metin:r.ad }), durumEtiketi));
    if (v.devreye_giris)
      kart.append(el("div.mini.sessiz", { metin:`Devreye giriş: ${v.devreye_giris}` }));

    if (!r.s) {
      kart.append(el("p.sessiz.mini", { stil:{ marginTop:"10px" },
        metin:`${secilenYil} yılında bu ekipman için yakıt veya üretim kaydı yok.` }));
      if (v.not) kart.append(el("p.mini.sessiz", { metin:v.not }));
      g.append(kart); continue;
    }
    if (r.s.tutarsiz) {
      kart.append(uyari("ciddi", el("b", { metin:"Yakıt kaydı yok, üretim kaydı var. " }),
        "Verim hesaplanamaz — Veri Denetimi ekranına bakın."));
      g.append(kart); continue;
    }

    const kalem = (ad, v2, birim) => el("div.satir", { stil:{ justifyContent:"space-between",
      gap:"10px", padding:"3px 0", fontSize:"13px" } },
      el("span.sessiz", { metin:ad }),
      el("span.sayi", { metin:`${say(v2, 0)} ${birim}` }));
    kart.append(el("div", { stil:{ marginTop:"8px",
      borderTop:"1px solid var(--kilavuz)", paddingTop:"6px" } },
      kalem("Yakıt girdisi", r.s.yakit, "kWh"),
      r.noktalar.elk   ? kalem("Elektrik üretimi", r.s.elektrik, "kWh") : null,
      r.noktalar.buhar ? kalem("Buhar üretimi", r.s.buhar, "kWh") : null,
      r.noktalar.ssu   ? kalem("Sıcak su üretimi", r.s.sicakSu, "kWh") : null));

    // yukariIyi=false olan satırda (kayıp) artış KÖTÜDÜR; ok yönü ile renk
    // birbirinden ayrılır, yoksa artan kayıp yeşil görünür.
    const oran = (ad, deg, oncekiDeg, yukariIyi = true) => {
      const p = (deg != null && oncekiDeg != null) ? (deg - oncekiDeg) * 100 : null;
      const iyi = p === null ? null : (yukariIyi ? p > 0 : p < 0);
      return el("div.satir", { stil:{ justifyContent:"space-between", gap:"10px",
        padding:"3px 0", fontSize:"13px" } },
        el("span.sessiz", { metin:ad }),
        el("span", {}, el("b.sayi", { metin:deg == null ? "—" : yuzde(deg * 100, 1) }),
          p === null ? null : el("span.mini", {
            stil:{ marginLeft:"7px", color:Math.abs(p) < 0.05 ? "var(--ink-mut)"
              : iyi ? "var(--iyi)" : "var(--ciddi)" },
            metin:`${p < 0 ? "▼" : "▲"} ${say(Math.abs(p), 1)} puan` })));
    };
    kart.append(el("div", { stil:{ marginTop:"6px",
      borderTop:"1px solid var(--kilavuz)", paddingTop:"6px" } },
      r.noktalar.elk ? oran("Elektrik verimi", r.s.elektrikVerimi, r.so?.elektrikVerimi) : null,
      (r.noktalar.buhar || r.noktalar.ssu) ? oran("Isı verimi", r.s.isiVerimi, r.so?.isiVerimi) : null,
      oran("Toplam verim", r.s.toplamVerim, r.so?.toplamVerim),
      oran("Kayıp", r.s.kayip, r.so?.kayip, false)));

    if (r.s.imkansiz) {
      kart.append(uyari("ciddi",
        el("b", { metin:`Toplam verim %${say(r.s.toplamVerim * 100, 1)} — fiziksel olarak imkânsız. ` }),
        `Faydalı enerji (${say(r.s.faydali, 0)} kWh) bu ekipmana atanmış yakıttan ` +
        `(${say(r.s.yakit, 0)} kWh) büyük. Eksik olan ${say(r.s.faydali - r.s.yakit, 0)} kWh ` +
        "en az bu kadar yakıt daha yakıldığı anlamına gelir. Bu bir performans sonucu " +
        "değil, yakıt ölçümünün ekipmana yanlış dağıtıldığının işaretidir (A-05). " +
        "Bu ekipman yıllar arası karşılaştırmaya alınmaz."));
    } else if (r.puanFark !== null && r.puanFark < -0.5 && !r.so?.imkansiz) {
      const kayip = (r.so.toplamVerim - r.s.toplamVerim) * r.s.yakit;
      const fy = yakitFiyatiKwh(r.noktalar.yakit.enerji_turu, yilDonemleri(secilenYil));
      kart.append(uyari(r.puanFark < -3 ? "ciddi" : "dikkat",
        `Verim ${secilenYil - 1}'e göre ${say(Math.abs(r.puanFark), 1)} puan düştü. ` +
        `${kisa(r.s.yakit, 1)} kWh yakıt üzerinden ≈ ${kisa(kayip, 1)} kWh/yıl kayıp` +
        (fy ? ` ≈ ${kisa(kayip * fy.fiyat, 1)} TL` : "") + ".",
        el("div", { stil:{ marginTop:"7px" } },
          el("button.dugme.kucuk", { metin:"→ Aksiyon aç", onclick:() => aksiyonAc({
            baslik:`${r.ad} verim düşüşü (${secilenYil})`,
            aciklama:`Toplam verim ${yuzde(r.so.toplamVerim * 100, 1)} → ` +
              `${yuzde(r.s.toplamVerim * 100, 1)} (${say(Math.abs(r.puanFark), 1)} puan). ` +
              `Yıllık kayıp ≈ ${say(kayip, 0)} kWh` +
              (fy ? ` ≈ ${say(kayip * fy.fiyat, 0)} TL` : "") + ". " +
              "Bakım durumu, yük dağılımı ve çalışma noktası incelenmeli.",
            baglam:{ kaynak:`Ekran 9 · Dönüşüm Verimliliği (${secilenYil})`,
                     varlik:r.kod, donem:String(secilenYil) },
            beklenen: fy ? kayip * fy.fiyat : null }) }))));
    }
    if (v.not) kart.append(el("p.mini.sessiz", { stil:{ marginTop:"8px" }, metin:v.not }));

    kart.append(el("div", { stil:{ marginTop:"8px" } },
      el("button.dugme.kucuk", { metin:v.not ? "Notu düzenle" : "+ Not ekle",
        onclick:() => notDuzenle(v.kod) })));
    g.append(kart);
  }
  k.append(g);
}

function notDuzenle(varlikKod) {
  const v = varlik(varlikKod);
  const a = el("textarea", { rows:4, stil:{ width:"100%" } });
  a.value = v.not || "";
  const f = el("div", {}, el("div.alan", {},
    el("label", { metin:"Not — bakım, arıza, devreden çıkarma gerekçesi" }), a,
    el("div.mini.sessiz", { metin:"Not varlığa yazılır ve raporlarda bu ekipmanın yanında görünür." })));
  onayla(`${v.ad} — not`, f, "Kaydet").then(ok => {
    if (!ok) return;
    v.not = a.value.trim();
    V.degisti("varlik"); yenile(); bildir("Not kaydedildi");
  });
}

/* --------------------------------------------------- G1 verim trendi */
function verimTrendi(k, varliklar) {
  const aylar = yilDonemleri(secilenYil);
  const seriler = [];
  for (const x of varliklar) {
    const deg = aylar.map(a => {
      const r = H.donusumVerimiAralik(x.varlik.kod, [a]);
      return r && r.toplamVerim != null ? r.toplamVerim * 100 : null;
    });
    if (deg.some(v => v !== null)) seriler.push({ ad:x.varlik.ad, degerler:deg });
  }
  if (!seriler.length) return;
  const kart = el("div.kart", {}, el("h2", { metin:`Toplam verim trendi · ${secilenYil}` }),
    el("p.mini.sessiz", { metin:
      "Boşluk, o ay ekipmanın çalışmadığı (yakıt yakmadığı) anlamına gelir — sıfır verim değildir." }));
  k.append(kart);
  // 8'den fazla seri kategorik renk düzenini bozar (5.7.2)
  G.cizgi(kart, { seriler:seriler.slice(0, 8), etiketler:aylar.map(a => AYLAR[a.ay - 1].slice(0, 3)),
                  birim:"%", ondalik:1, boy:300 });
  if (seriler.length > 8)
    kart.append(el("p.mini.sessiz", { metin:`${seriler.length - 8} ekipman grafiğe sığmadı; tabloya bakın.` }));
}

/* ----------------------------------------- G2 yakıt → faydalı dağılımı */
function yakitDagilimi(k, calisan) {
  const et = calisan.map(r => r.ad);
  const seriler = [
    { ad:"Elektrik", degerler:calisan.map(r => r.s.elektrik) },
    { ad:"Buhar",    degerler:calisan.map(r => r.s.buhar) },
    { ad:"Sıcak su", degerler:calisan.map(r => r.s.sicakSu) },
    { ad:"Kayıp",    degerler:calisan.map(r => Math.max(0, r.s.yakit - r.s.faydali)),
      renk:"var(--ink-mut)" },
  ].filter(s => s.degerler.some(v => v > 0));
  const kart = el("div.kart", {}, el("h2", { metin:`Yakıt nereye gitti · ${secilenYil}` }),
    el("p.mini.sessiz", { metin:
      "Her sütunun tamamı o ekipmanın yaktığı yakıttır; kayıp payı üzerine eklenmez, içindedir (6.7)." }));
  k.append(kart);
  G.sutun(kart, { seriler, etiketler:et, birim:"kWh", yigili:true, boy:300 });
}

/* ------------------------------------------- G3 varlık karşılaştırması */
function karsilastirma(k, calisan) {
  const sirali = [...calisan].filter(r => r.s.toplamVerim != null)
    .sort((a, b) => b.s.toplamVerim - a.s.toplamVerim);
  if (!sirali.length) return;
  const kart = el("div.kart", {}, el("h2", { metin:"Aynı işi hangi ekipman daha verimli yapıyor?" }),
    el("p.mini.sessiz", { metin:
      "Yük dağıtım kararının sayısal karşılığı: yakıtı en verimli çeviren ekipmana yük " +
      "kaydırmak, hiç yatırım yapmadan tasarruf demektir (9.10)." }));
  const enb = sirali[0].s.toplamVerim;
  kart.append(tablo([
    { ad:"Ekipman", anahtar:"ad" },
    { ad:"", deger:r => el("div.satir", { stil:{ gap:"8px", alignItems:"center" } },
        G.oranCubugu(r.s.toplamVerim / enb, { en:150 }),
        el("span.sayi.mini", { metin:yuzde(r.s.toplamVerim * 100, 1) })) },
    { ad:"Yakıt (kWh)", sayi:true, deger:r => r.s.yakit },
    { ad:"Faydalı (kWh)", sayi:true, deger:r => r.s.faydali },
    { ad:"Pay", deger:r => yuzde(r.s.yakit / sirali.reduce((t, x) => t + x.s.yakit, 0) * 100, 1) },
  ], sirali));
  k.append(kart);
}

/* --------------------------------------------------- T1 verim tablosu */
function verimTablosu(k, satirlar) {
  const kart = el("div.kart", {}, el("h2", { metin:"Verim tablosu" }),
    el("p.mini.sessiz", { metin:
      "Durum ikonu, mutlak bir verim eşiğine değil önceki yıla göre değişime bakar: " +
      "! verisi tutarsız (faydalı enerji > yakıt) · ✕ 3 puandan fazla düşüş · " +
      "⚠ 0,5–3 puan düşüş · ✓ iyileşme. " +
      "Üretici katalog verisiyle mutlak karşılaştırma ileride eklenecektir (9.10)." }));
  const ikon = r => (r.s?.imkansiz || r.so?.imkansiz) ? "!"
    : r.puanFark === null ? ""
    : r.puanFark < -3 ? "✕" : r.puanFark < -0.5 ? "⚠" : r.puanFark > 0.5 ? "✓" : "–";
  const renkli = (v, ond = 1) => v == null ? "—" : yuzde(v * 100, ond);
  kart.append(tablo([
    { ad:"", baslik:r => (r.s?.imkansiz || r.so?.imkansiz)
        ? "Veri tutarsız: faydalı enerji yakıttan büyük" : "",
      deger:r => el("span", { stil:{ fontWeight:"600",
        color: (r.s?.imkansiz || r.so?.imkansiz) ? "var(--ciddi)"
        : r.puanFark === null ? "var(--ink-mut)"
        : r.puanFark < -0.5 ? "var(--ciddi)" : r.puanFark > 0.5 ? "var(--iyi)" : "var(--ink-mut)" },
        metin:ikon(r) }) },
    { ad:"Ekipman", anahtar:"ad" },
    { ad:`Yakıt ${secilenYil}`, sayi:true, deger:r => r.s?.yakit ?? null },
    { ad:"Elektrik verimi", deger:r => renkli(r.s?.elektrikVerimi) },
    { ad:"Isı verimi", deger:r => renkli(r.s?.isiVerimi) },
    { ad:`Toplam verim ${secilenYil}`, deger:r => renkli(r.s?.toplamVerim) },
    { ad:`Toplam verim ${secilenYil - 1}`, deger:r => renkli(r.so?.toplamVerim) },
    { ad:"Fark (puan)", deger:r => r.puanFark === null ? "—"
        : el("span", { stil:{ color:r.puanFark < 0 ? "var(--ciddi)" : "var(--iyi)" },
            metin:(r.puanFark > 0 ? "+" : "−") + say(Math.abs(r.puanFark), 1) }) },
    { ad:"Kayıp (kWh)", sayi:true, deger:r => r.s?.kayipKwh ?? null },
  ], satirlar));
  k.append(kart);
}

/* ------------------------------------ katsayı değişimi uyarısı (İ-5, S12) */
/**
 * Buhar kg → kWh katsayısı karşılaştırılan iki yılda farklıysa, verim
 * değişiminin bir kısmı fizik değil VARSAYIM değişimidir. Bu ayrım
 * gösterilmezse ekran yanıltır.
 */
function katsayiUyarisi(k, ekipman) {
  const kk = H.katsayiKarsilastir("BUH", "kg", "kWh",
    { yil:secilenYil - 1, ay:12 }, { yil:secilenYil, ay:12 });
  if (kk.bilinmiyor || kk.ayni) return;

  // Etkiyi ekipman bazında ver: kg aynı kalırken raporlanan kWh değişir.

    .map(r => { const d = H.verimKatsayiDuzeltmesi(r.s, kk.oran);

  return durum.baz_cizgiler.find(b => b.kod === k) || durum.baz_cizgiler[0] || null;
}

/** CUSUM — kümülatif sapma (8.5) */
function cusum(sapmalar) {
  let t = 0;
  return sapmalar.map(s => { t += (s ?? 0); return t; });
}

/* ===================================================================
   FAZ 4 — dönüşüm, maliyet ve ayrı tesis toplamları
   Ekran 9/10/11 kendi hesabını yapmaz; hepsi buradan okur (İ-2).
   =================================================================== */

/** Bir dönem aralığında bir noktanın toplamı. Hiç veri yoksa null (İ-3). */
function donemToplami(kod, donemler) {
  let t = 0, varMi = false;
  for (const d of donemler) {
    const r = noktaDeger(kod, d.yil, d.ay);
    if (Number.isFinite(r.deger)) { t += r.deger; varMi = true; }
  }
  return varMi ? t : null;
}

/* ------------------------------------------------- dönüşüm varlıkları */
/**
 * Bir varlığın dönüşüm noktaları. SABİT LİSTE DEĞİL: roller taranır,
 * yeni bir kazan tanımlandığında ekran kendiliğinden onu da gösterir.
 */
function donusumNoktalari(varlikKod) {
  const nk = varlikNoktalari(varlikKod).filter(n => n.aktif !== false);
  return {
    yakit: nk.find(n => n.rol === "satin_alinan" && n.birim === "kWh") || null,
    elk:   nk.find(n => n.rol === "tesis_ici_uretim" && n.enerji_turu === "ELK" && n.birim === "kWh") || null,
    buhar: nk.find(n => n.rol === "ara_enerji" && n.enerji_turu === "BUH" && n.birim === "kWh") || null,
    ssu:   nk.find(n => n.rol === "ara_enerji" && n.enerji_turu === "SSU" && n.birim === "kWh") || null,
  };
}

/** Yakıtı faydalı enerjiye çeviren bütün varlıklar (rol taramasıyla) */
function donusumVarliklari() {
  const liste = [];
  for (const v of durum.varliklar) {
    if (v.aktif === false) continue;
    const n = donusumNoktalari(v.kod);
    if (!n.yakit) continue;
    if (!n.elk && !n.buhar && !n.ssu) continue;
    liste.push({ varlik: v, noktalar: n });
  }
  return liste;
}

/**
 * Bir dönem aralığında toplanmış dönüşüm verimi (8.6).
 * Verim, AYLIK ORANLARIN ORTALAMASI DEĞİL, toplamların oranıdır —
 * aksi halde az yakıt yakılan ay, çok yakılan ayla aynı ağırlığı alır.
 */
function donusumVerimiAralik(varlikKod, donemler) {
  const n = donusumNoktalari(varlikKod);
  if (!n.yakit) return null;
  const yakit = donemToplami(n.yakit.kod, donemler);
  const elektrik = n.elk   ? (donemToplami(n.elk.kod, donemler)   || 0) : 0;
  const buhar    = n.buhar ? (donemToplami(n.buhar.kod, donemler) || 0) : 0;
  const sicakSu  = n.ssu   ? (donemToplami(n.ssu.kod, donemler)   || 0) : 0;
  const faydali  = elektrik + buhar + sicakSu;
  if (!Number.isFinite(yakit) || !yakit) {
    // yakıt yok ama üretim varsa bu bir veri tutarsızlığıdır, sessizce geçilmez
    return faydali ? { yakit:yakit || 0, elektrik, buhar, sicakSu, faydali,
                       tutarsiz:true, elektrikVerimi:null, isiVerimi:null,
                       toplamVerim:null, kayip:null } : null;
  }
  return {
    yakit, elektrik, buhar, sicakSu, faydali,
    elektrikVerimi: elektrik / yakit,
    isiVerimi: (buhar + sicakSu) / yakit,
    toplamVerim: faydali / yakit,
    kayip: 1 - faydali / yakit,
    kayipKwh: yakit - faydali,
    // Faydalı enerji yakıttan büyük olamaz. Olduğunda bu bir PERFORMANS
    // değil VERİ sorunudur; sonuç gizlenmez ama performans gibi de
    // sunulmaz (İ-3, 6.8). Yüzde 2 pay yuvarlama içindir.
    imkansiz: faydali > yakit * 1.02,
    calisan: donemler.filter(d => Number.isFinite(noktaDeger(n.yakit.kod, d.yil, d.ay).deger)
                                  && noktaDeger(n.yakit.kod, d.yil, d.ay).deger > 0).length,
  };
}

/* ------------------------------------------------------ fatura kalemleri */
/**
 * Maliyet noktaları ve faturalandırdıkları tüketim.
 * `fatura_tuketim` alanı hangi ölçüm noktalarının o faturayı oluşturduğunu
 * söyler; boşsa birim fiyat hesaplanamaz ama tutar yine toplanır (İ-3).
 */
function faturaKalemleri() {
  return durum.olcum_noktalari
    .filter(n => n.aktif !== false && n.rol === "maliyet")
    .map(n => {
      const kodlar = (n.fatura_tuketim || []).filter(k => nokta(k));
      const ilk = kodlar.length ? nokta(kodlar[0]) : null;
      return { fatura:n, tuketimKodlari:kodlar,
               tuketimBirim: ilk ? ilk.birim : null,
               enerjiTuru: ilk ? ilk.enerji_turu : null };
    });
}

/** Bir fatura kaleminin bir aralıktaki tutarı, miktarı ve birim fiyatı (K-12) */
function faturaOzeti(kalem, donemler) {
  const tutar = donemToplami(kalem.fatura.kod, donemler);
  let miktar = null;
  for (const k of kalem.tuketimKodlari) {
    const t = donemToplami(k, donemler);
    if (Number.isFinite(t)) miktar = (miktar || 0) + t;
  }
  return { tutar, miktar, birim:kalem.tuketimBirim,
           birimFiyat: (Number.isFinite(tutar) && Number.isFinite(miktar) && miktar)
                        ? tutar / miktar : null };
}

/** Birim fiyatı kWh cinsine çevirir — farklı yakıtlar ancak böyle kıyaslanır */
function birimFiyatKwh(kalem, donemler) {
  const o = faturaOzeti(kalem, donemler);
  if (o.birimFiyat === null) return null;
  if (o.birim === "kWh") return o.birimFiyat;
  const son = donemler[donemler.length - 1];
  const c = cevir(1, o.birim, "kWh", kalem.enerjiTuru, son.yil, son.ay);
  if (c.eksik || !c.deger) return null;
  return o.birimFiyat / c.deger;
}

/**
 * Bir fatura kaleminin iki dönem arası fiyat/hacim ayrıştırması (8.7).
 * Ayrıştırma faturanın KENDİ biriminde yapılır (elektrik kWh, doğalgaz m³);
 * çevrim yapılırsa katsayı hatası etkilere karışır.
 */
function kalemFiyatHacim(kalem, oncekiDonemler, simdikiDonemler) {
  const a = faturaOzeti(kalem, oncekiDonemler);
  const b = faturaOzeti(kalem, simdikiDonemler);
  if (a.birimFiyat === null || b.birimFiyat === null) return null;
  const d = fiyatHacim(a.birimFiyat, a.miktar, b.birimFiyat, b.miktar);
  if (!d) return null;
  return { ...d, onceki:a, simdiki:b,
           fiyatDegisim:(b.birimFiyat - a.birimFiyat) / a.birimFiyat,
           hacimDegisim: a.miktar ? (b.miktar - a.miktar) / a.miktar : null };
}

/** Bir aralıktaki maliyet dökümü: kalemler, GES mahsubu ve net toplam */
function maliyetDokumu(donemler) {
  const kalemler = faturaKalemleri().map(k => ({ ...k, ...faturaOzeti(k, donemler) }));
  const brut = kalemler.reduce((t, k) => t + (k.tutar || 0), 0);
  const mahsup = donemToplami0(gelirNoktalari(), donemler);
  return { kalemler, brut, mahsup, net: brut - mahsup };
}

/** Rolü `gelir` olan noktalar — GES mahsubu ve satışı (K-13) */
function gelirNoktalari() {
  return durum.olcum_noktalari.filter(n => n.aktif !== false && n.rol === "gelir");
}

function donemToplami0(noktalar, donemler) {
  let t = 0;
  for (const n of noktalar) t += donemToplami(n.kod, donemler) || 0;
  return t;
}

/* ------------------------------------------------- ayrı tesis (GES, K-03) */
/**
 * Ayrı tesisler: üretimi fabrikanın kWh dengesine GİRMEZ, yalnızca
 * mali dengeye mahsup olarak girer (7.1, 7.2).
 */
function ayriTesisler() {
  const liste = [];
  for (const v of durum.varliklar) {
    if (v.aktif === false) continue;
    const nk = varlikNoktalari(v.kod).filter(n => n.aktif !== false);
    const uretim = nk.find(n => n.rol === "ayri_tesis_uretim");
    if (!uretim) continue;
    liste.push({ varlik:v, uretim, gelirler:nk.filter(n => n.rol === "gelir") });
  }
  return liste;
}
function ayriTesisOzeti(tesis, donemler) {
  const uretim = donemToplami(tesis.uretim.kod, donemler);
  let gelir = null;
  for (const g of tesis.gelirler) {
    const t = donemToplami(g.kod, donemler);
    if (Number.isFinite(t)) gelir = (gelir || 0) + t;
  }
  const dolu = donemler.filter(d =>
    Number.isFinite(noktaDeger(tesis.uretim.kod, d.yil, d.ay).deger));
  return { uretim, gelir, ay:dolu.length,
           birimDeger: (Number.isFinite(gelir) && Number.isFinite(uretim) && uretim)
                        ? gelir / uretim : null,
           ilk: dolu[0] || null, son: dolu[dolu.length - 1] || null };
}

/* ---------------------------------------- katsayı değişimi uyarısı (İ-5) */
/**
 * İki dönemde aynı çevrim katsayısı mı kullanılıyor?
 * Katsayı değiştiyse iki dönem arasındaki farkın bir kısmı FİZİK DEĞİL,
 * VARSAYIM değişimidir. Bu asla sessizce geçilmez (İ-5, 6.6).
 */
function katsayiKarsilastir(turKod, kaynakBirim, hedefBirim, donemA, donemB) {
  const a = katsayi(turKod, kaynakBirim, hedefBirim, donemA.yil, donemA.ay);
  const b = katsayi(turKod, kaynakBirim, hedefBirim, donemB.yil, donemB.ay);
  if (!a || !b) return { a, b, ayni:true, bilinmiyor:true };
  return { a, b, ayni: a.katsayi === b.katsayi,
           oran: a.katsayi ? b.katsayi / a.katsayi : null };
}

/**
 * Bir dönüşüm veriminin, ısı katsayısı eski dönemdekiyle aynı olsaydı
 * ne olacağı. Verim düşüşünün ne kadarı varsayım değişimi, ne kadarı
 * gerçek performanstır sorusunu ayırır.
 */
function verimKatsayiDuzeltmesi(s, oran) {
  if (!s || !Number.isFinite(oran) || !oran || !s.yakit) return null;
  const isi = (s.buhar + s.sicakSu) / oran;        // eski katsayıya geri çevir
  const faydali = s.elektrik + isi;
  return { toplamVerim: faydali / s.yakit, faydali, isi };
}

/* ------------------------------- ekipmana atanmamış yakıt (6.7, A-05) */
/**
 * Satın alınan yakıt ile dönüşüm ekipmanlarına atanmış yakıt arasındaki fark.
 * Fark büyükse ekipman verimleri güvenilmezdir — hatta %100'ü aşabilir.
 * Enerji türü başına ayrı hesaplanır; sabit bir yakıt listesi yoktur (K-24).
 */
function atanmamisYakit(donemler) {
  const satin = new Map();          // enerji_turu -> kWh
  for (const n of durum.olcum_noktalari) {
    if (n.aktif === false || n.rol !== "satin_alinan" || !n.toplama_dahil) continue;
    if (n.birim !== "kWh" || n.enerji_turu === "ELK") continue;
    const t = donemToplami(n.kod, donemler);
    if (Number.isFinite(t)) satin.set(n.enerji_turu, (satin.get(n.enerji_turu) || 0) + t);
  }
  const ekip = new Map();
  for (const x of donusumVarliklari()) {
    const y = x.noktalar.yakit;
    if (!y || y.birim !== "kWh") continue;
    const t = donemToplami(y.kod, donemler);
    if (Number.isFinite(t)) ekip.set(y.enerji_turu, (ekip.get(y.enerji_turu) || 0) + t);
  }
  const sonuc = [];
  for (const [tur, s] of satin) {
    const e = ekip.get(tur) || 0;
    sonuc.push({ enerji_turu:tur, satinAlinan:s, ekipman:e,
                 atanmamis:s - e, oran: s ? (s - e) / s : null,
                 olcumsuz: olcumsuzTuketiciler() });
  }
  return sonuc;
}

/**
 * Sayacı olmayan ama bir istasyondan beslendiği BİLİNEN tüketiciler (A-05).
 * Atanmamış yakıtın nereye gittiği sorusunun cevabı burada adlandırılır:
 * "bilinmiyor" demekle "sayacı yok" demek aynı şey değildir.
 */
function olcumsuzTuketiciler(istasyonKod = null) {
  return durum.varliklar
    .filter(v => v.aktif !== false && v.olcumsuz_besleyen &&
                 (!istasyonKod || v.olcumsuz_besleyen === istasyonKod))
    .map(v => ({ kod:v.kod, ad:v.ad, besleyen:v.olcumsuz_besleyen,
                 besleyenAd: varlik(v.olcumsuz_besleyen)?.ad || v.olcumsuz_besleyen }));
}

/* ===================================================================
   FAZ 5 — İZLENEBİLİRLİK (E-4)
   "Bu sayı nereden geliyor?" sorusunun tek tıkla cevabı.
   =================================================================== */

/** Bir formüldeki ölçüm noktası kodları ve KATSAYI() çağrıları */
function formulBilesenleri(formul) {
  const metin = String(formul || "");
  const katsayilar = [];
  const temiz = metin.replace(/KATSAYI\(\s*([A-Za-z_]+)\s*,\s*([^,)]+)\s*,\s*([^)]+)\s*\)/g,
    (_, tur, kay, hed) => {
      katsayilar.push({ tur:tur.trim(), kaynak:kay.trim(), hedef:hed.trim() });
      return " ";
    });
  const kodlar = [...new Set((temiz.match(/\b[A-Z][A-Z0-9_]*\b/g) || [])
    .filter(k => nokta(k)))];
  return { kodlar, katsayilar };
}

/**
 * Bir ölçüm noktasının bir dönemdeki KÖKEN AĞACI.
 * Ölçülen nokta yaprak olur (değer + kalite + not);
 * hesaplanan nokta formülüyle birlikte çocuklarına iner.
 * `derinlik` sonsuz döngüye karşı sınırdır.
 */
function noktaKokeni(kod, yil, ay, derinlik = 4, ziyaret = null) {
  const n = nokta(kod);
  if (!n) return { kod, eksik:`${kod} tanımlı değil` };
  const r = noktaDeger(kod, yil, ay);
  const dugum = {
    kod, ad:n.ad, birim:n.birim, veri_tipi:n.veri_tipi, rol:n.rol,
    varlik:n.varlik, deger:r.deger ?? null,
    eksik:r.eksik || null, veriYok:!!r.veriYok, sebep:r.sebep || null,
    cocuklar:[], katsayilar:[],
  };
  if (n.veri_tipi === "olculen" || n.veri_tipi === "tahmini") {
    const k = degerKayit(kod, yil, ay);
    dugum.kalite = k?.k || (k ? "girildi" : null);
    dugum.not = k?.not || null;
    dugum.kaynakTipi = "ham";
    return dugum;
  }
  dugum.kaynakTipi = n.veri_tipi === "dagitilmis" ? "dagitim" : "formul";
  dugum.formul = n.formul || null;
  const z = ziyaret || new Set();
  if (z.has(kod) || derinlik <= 0) { dugum.kesildi = true; return dugum; }
  z.add(kod);
  const b = formulBilesenleri(n.formul);
  for (const c of b.kodlar) dugum.cocuklar.push(noktaKokeni(c, yil, ay, derinlik - 1, z));
  for (const kt of b.katsayilar) {
    const k = katsayi(kt.tur, kt.kaynak, kt.hedef, yil, ay);
    dugum.katsayilar.push({ ...kt, kayit:k || null });
  }
  z.delete(kod);
  return dugum;
}

/** Ortak birime çevrilirken kullanılan katsayı (toplamların kökeni için) */
function noktaCevrimKatsayisi(kod, hedefBirim, yil, ay) {
  const n = nokta(kod);
  if (!n || n.birim === hedefBirim) return null;
  return katsayi(n.enerji_turu, n.birim, hedefBirim, yil, ay);
}

/* ===================================================================
   FAZ 5 — HEDEFLER VE AKSİYONLAR (9.13, K-21)
   Dört hedef türü de aynı motordan beslenir.
   =================================================================== */
const HEDEF_TURLERI = {
  enpi:     { ad:"EnPI hedefi",     birim:"", yon:"azalt",
              aciklama:"Üretim dalgalanmasından arındırılmış performans" },
  tuketim:  { ad:"Tüketim hedefi",  birim:"kWh", yon:"azalt",
              aciklama:"Mutlak kWh — üretim düşerse kendiliğinden tutar" },
  maliyet:  { ad:"Maliyet hedefi",  birim:"TL", yon:"azalt",
              aciklama:"TL — fiyat piyasadan gelir, hepsi bizim başarımız değildir" },
  tasarruf: { ad:"Tasarruf hedefi", birim:"%", yon:"artir",
              aciklama:"Baz çizgiye göre iyileşme yüzdesi" },
};

/**
 * Bir hedefin dönem dönem gerçekleşmesi ve durumu.
 * Oranlar (EnPI, tasarruf) TOPLANMAZ; dönemin tamamı için yeniden hesaplanır.
 */
function hedefDurumu(h) {
  const d = [];
  let y = h.bas.yil, a = h.bas.ay, guvenlik = 0;
  while ((y < h.son.yil || (y === h.son.yil && a <= h.son.ay)) && guvenlik++ < 600) {
    d.push({ yil:y, ay:a });
    const t = y * 12 + a; y = Math.floor(t / 12); a = (t % 12) + 1;
  }
  if (!d.length) return { hata:"Hedef dönemi boş" };

  const seri = d.map(x => ({ ...x, deger: hedefOlcumu(h, [x]) }));
  const gercek = hedefOlcumu(h, d);
  const tur = HEDEF_TURLERI[h.tur];
  const yon = h.yon || tur?.yon || "azalt";
  if (!Number.isFinite(gercek)) return { seri, donemler:d, gercek:null, yon };

  const fark = yon === "azalt" ? h.deger - gercek : gercek - h.deger;
  return {
    seri, donemler:d, gercek, yon,
    tuttu: fark >= 0,
    kalan: Math.abs(fark),
    // hedefe ne kadar yaklaşıldı: 1,00 = hedef tam tutuyor
    oran: h.deger ? (yon === "azalt" ? h.deger / gercek : gercek / h.deger) : null,
    doluAy: seri.filter(s => Number.isFinite(s.deger)).length,
  };
}

/** Bir hedefin ölçüsünü verilen dönemler için üretir */
function hedefOlcumu(h, donemler) {
  if (h.tur === "tuketim" || h.tur === "maliyet") {
    let t = 0, varMi = false;
    for (const x of donemler) {
      const r = h.tur === "maliyet"
        ? (h.ifade && h.ifade !== "@TOPLAM_MALIYET_TL"
            ? noktaDeger(h.ifade, x.yil, x.ay) : toplamMaliyet(x.yil, x.ay))
        : (h.ifade && h.ifade !== "@TOPLAM_ENERJI_KWH"
            ? noktaDeger(h.ifade, x.yil, x.ay) : toplamEnerji(x.yil, x.ay, "kWh"));
      if (Number.isFinite(r?.deger)) { t += r.deger; varMi = true; }
    }
    return varMi ? t : null;
  }
  if (h.tur === "enpi") {
    // Dönem EnPI'si = dönem payı ÷ dönem paydası (aylık oranların ortalaması DEĞİL)
    const t = durum.enpi_tanimlari.find(x => x.kod === h.ifade);
    if (!t) return null;
    let pay = 0, payda = 0, varMi = false;
    for (const x of donemler) {
      const p = enpiTerimi(t.pay, x.yil, x.ay), q = enpiTerimi(t.payda, x.yil, x.ay);
      if (Number.isFinite(p?.deger) && Number.isFinite(q?.deger)) {
        pay += p.deger; payda += q.deger; varMi = true;
      }
    }
    return varMi && payda ? pay / payda : null;
  }
  if (h.tur === "tasarruf") {
    // Baz çizgiye göre iyileşme: (1 − gerçek/beklenen) × 100
    const bz = durum.baz_cizgiler.find(b => b.kod === h.ifade) || etkinBazCizgi();
    if (!bz) return null;
    let g = 0, b = 0, varMi = false;
    for (const x of donemler) {
      const r = bazCizgiDegerlendir(bz, x.yil, x.ay);
      if (r) { g += r.gercek; b += r.beklenen; varMi = true; }
    }
    return varMi && b ? (1 - g / b) * 100 : null;
  }
  return null;
}

/** Aksiyon durumları ve gecikme (9.13) */
const AKSIYON_DURUMLARI = {
  acik:    { ad:"Açık",    ikon:"○", acikMi:true },
  devam:   { ad:"Devam",   ikon:"◐", acikMi:true },
  kapandi: { ad:"Kapandı", ikon:"●", acikMi:false },
  iptal:   { ad:"İptal",   ikon:"×", acikMi:false },
};
function aksiyonGecikti(a, bugunISO) {
  if (!AKSIYON_DURUMLARI[a.durum]?.acikMi || !a.termin) return false;
  return a.termin < bugunISO;
}

/* ------------------------------------------------- fare üstü katmanı */
function kutucuk() {
  const d = el("div", { stil:{ position:"fixed", pointerEvents:"none", zIndex:"40",
    background:"var(--yuzey)", border:"1px solid var(--cerceve)", borderRadius:"6px",
    padding:"7px 10px", fontSize:"12px", boxShadow:"0 4px 16px rgba(0,0,0,.18)",
    display:"none", maxWidth:"280px" } });
  document.body.append(d);
  return {
    goster(olay, icerik) {
      d.innerHTML = ""; d.append(icerik); d.style.display = "block";
      const k = d.getBoundingClientRect();
      d.style.left = Math.min(olay.clientX + 14, innerWidth - k.width - 8) + "px";
      d.style.top  = Math.max(8, olay.clientY - k.height - 12) + "px";
    },
    gizle() { d.style.display = "none"; },
    yok() { d.remove(); },
  };
}

/* ------------------------------------------- tablo olarak göster (E-3) */
function sarmala(kap, svg, ek, tabloVeri) {
  const govde = el("div", {}, svg, ek);
  const tbl = el("div", { stil:{ display:"none", marginTop:"8px" } });
  let acik = false;
  const dugme = el("button.dugme.kucuk", { metin:"Tablo olarak göster",
    stil:{ marginTop:"8px" }, onclick:() => {
      acik = !acik;
      tbl.style.display = acik ? "block" : "none";
      govde.style.display = acik ? "none" : "block";
      dugme.textContent = acik ? "Grafiğe dön" : "Tablo olarak göster";
      if (acik && !tbl.firstChild) tbl.append(tabloVeri());
    } });
  kap.append(govde, dugme, tbl);
  return kap;
}

const basitTablo = (basliklar, satirlar) => {
  const t = el("table");
  t.append(el("thead", {}, el("tr", {}, basliklar.map((b, i) =>
    el(i ? "th.s" : "th", { metin:b })))));
  const gv = el("tbody");
  for (const r of satirlar)
    gv.append(el("tr", {}, r.map((c, i) => el(i ? "td.s" : "td",
      { metin: c === null || c === undefined ? "—" : typeof c === "number" ? say(c, 0) : String(c) }))));
  t.append(gv);
  return el("div.tablo-sar", {}, t);
};

/* =============================================================== SÜTUN */
/**
 * @param seriler [{ad, degerler:[], renk?}]  · yigili:true → yığılmış sütun
 * Tek seri → açıklama yok, başlık seriyi adlandırır (5.7.3).
 */
function sutun(kap, { seriler, etiketler, birim = "", yigili = false,
                             boy = 260, ondalik = 0, baslik = "" } = {}) {
  kap = kap || el("div");
  const { svg, ic } = iskelet(kap, { boy, baslik });
  const n = etiketler.length;

  const toplamlar = etiketler.map((_, i) =>
    yigili ? seriler.reduce((t, d) => t + (d.degerler[i] || 0), 0)
           : Math.max(...seriler.map(d => d.degerler[i] || 0)));
  const enb = Math.max(0, ...toplamlar);
  const enk = Math.min(0, ...seriler.flatMap(d => d.degerler.filter(Number.isFinite)));
  const ol = eksen(enk, enb);
  ykilavuz(svg, ic, ol, birim, ondalik);
  xetiket(svg, ic, etiketler);

  const adim = ic.en / n;
  const y0 = v => ic.y + ic.boy - ((v - ol.alt) / (ol.ust - ol.alt)) * ic.boy;
  const kt = kutucuk();
  const grup = s("g");

  for (let i = 0; i < n; i++) {
    let taban = 0;
    const seriSay = yigili ? 1 : seriler.length;
    const cw = Math.max(2, (adim * 0.68) / seriSay);
    seriler.forEach((d, j) => {
      const v = d.degerler[i];
      if (!Number.isFinite(v)) return;
      const x = yigili ? ic.x + i * adim + (adim - cw) / 2
                       : ic.x + i * adim + (adim - cw * seriSay) / 2 + j * cw;
      const yUst = yigili ? y0(taban + v) : y0(v);
      const yTab = yigili ? y0(taban) : y0(0);
      const h = Math.max(0, yTab - yUst);
      grup.append(s("rect", { x:x.toFixed(1), y:yUst.toFixed(1),
        width:(cw - (yigili ? 0 : 1)).toFixed(1),
        height:Math.max(0, h - (yigili && j < seriler.length - 1 ? 2 : 0)).toFixed(1),
        rx:Math.min(4, cw / 3), fill:d.renk || renk(j) }));   // 4px yuvarlak uç
      taban += v;
    });
    // fare üstü: bütün sütunu kaplayan saydam hedef
    const hedef = s("rect", { x:(ic.x + i * adim).toFixed(1), y:ic.y,
      width:adim.toFixed(1), height:ic.boy, fill:"transparent" });
    hedef.addEventListener("mousemove", ev => kt.goster(ev,
      el("div", {}, el("b", { metin:etiketler[i] }),
        seriler.map((d, j) => el("div", {},
          el("span", { stil:{ display:"inline-block", width:"8px", height:"8px",
            borderRadius:"2px", background:d.renk || renk(j), marginRight:"6px" } }),
          `${d.ad}: ${say(d.degerler[i], ondalik)} ${birim}`)))));
    hedef.addEventListener("mouseleave", kt.gizle);
    grup.append(hedef);
  }
  svg.append(grup);

  return sarmala(kap, svg, aciklama(seriler),
    () => basitTablo(["Dönem", ...seriler.map(d => d.ad)],
      etiketler.map((e, i) => [e, ...seriler.map(d => d.degerler[i])])));
}

/* =============================================================== ÇİZGİ */
/** @param referans {deger, ad} → yatay referans hattı (baz çizgi vb.) */
function cizgi(kap, { seriler, etiketler, birim = "", boy = 260,
                             ondalik = 0, referans = null, baslik = "" } = {}) {
  kap = kap || el("div");
  const { svg, ic } = iskelet(kap, { boy, baslik });
  const hepsi = seriler.flatMap(d => d.degerler).filter(Number.isFinite);
  if (referans) hepsi.push(referans.deger);
  const ol = eksen(Math.min(...hepsi), Math.max(...hepsi));
  ykilavuz(svg, ic, ol, birim, ondalik);
  xetiket(svg, ic, etiketler);

  const n = etiketler.length;
  const dx = n > 1 ? ic.en / (n - 1) : 0;
  const px = i => ic.x + i * dx;
  const py = v => ic.y + ic.boy - ((v - ol.alt) / (ol.ust - ol.alt)) * ic.boy;

  if (referans) {
    svg.append(s("line", { x1:ic.x, y1:py(referans.deger), x2:ic.x + ic.en, y2:py(referans.deger),
      stroke:"var(--ink-mut)", "stroke-width":1 }));
    svg.append(s("text", { x:ic.x + ic.en, y:py(referans.deger) - 5, "text-anchor":"end",
      fill:"var(--ink-mut)", "font-size":10 }, document.createTextNode(referans.ad)));
  }

  seriler.forEach((d, j) => {
    let yol = "", kalem = false;
    d.degerler.forEach((v, i) => {
      if (!Number.isFinite(v)) { kalem = false; return; }
      yol += (kalem ? "L" : "M") + px(i).toFixed(1) + "," + py(v).toFixed(1) + " ";
      kalem = true;
    });
    svg.append(s("path", { d:yol, fill:"none", stroke:d.renk || renk(j),
      "stroke-width":2, "stroke-linejoin":"round", "stroke-linecap":"round" }));
    // Seçici etiketleme: yalnız uç nokta (5.7.2)
    const son = d.degerler.map((v, i) => [v, i]).filter(([v]) => Number.isFinite(v)).pop();
    if (son) {
      svg.append(s("circle", { cx:px(son[1]), cy:py(son[0]), r:3.5,
        fill:d.renk || renk(j), stroke:"var(--yuzey)", "stroke-width":2 }));
      if (seriler.length <= 4)
        svg.append(s("text", { x:px(son[1]) - 8, y:py(son[0]) - 9, "text-anchor":"end",
          fill:"var(--ink-2)", "font-size":11, "font-weight":600 },
          document.createTextNode(say(son[0], ondalik))));
    }
  });

  // dikey nişangâh + kutucuk
  const kt = kutucuk();
  const nisan = s("line", { y1:ic.y, y2:ic.y + ic.boy, stroke:"var(--taban)",
    "stroke-width":1, opacity:0 });
  svg.append(nisan);
  const kapak = s("rect", { x:ic.x, y:ic.y, width:ic.en, height:ic.boy, fill:"transparent" });
  kapak.addEventListener("mousemove", ev => {
    const kutu = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round((ev.clientX - kutu.left - ic.x) / (dx || 1))));
    nisan.setAttribute("x1", px(i)); nisan.setAttribute("x2", px(i));
    nisan.setAttribute("opacity", .6);
    kt.goster(ev, el("div", {}, el("b", { metin:etiketler[i] }),
      seriler.map((d, j) => el("div", {},
        el("span", { stil:{ display:"inline-block", width:"8px", height:"8px",
          borderRadius:"2px", background:d.renk || renk(j), marginRight:"6px" } }),
        `${d.ad}: ${Number.isFinite(d.degerler[i]) ? say(d.degerler[i], ondalik) + " " + birim : "—"}`))));
  });
  kapak.addEventListener("mouseleave", () => { nisan.setAttribute("opacity", 0); kt.gizle(); });
  svg.append(kapak);

  return sarmala(kap, svg, aciklama(seriler),
    () => basitTablo(["Dönem", ...seriler.map(d => d.ad)],
      etiketler.map((e, i) => [e, ...seriler.map(d => d.degerler[i])])));
}

/* ========================================================= ISI HARİTASI */
/** Sıralı tek hue (5.7.1). Ölçek açıklaması ZORUNLU. */
function isiHaritasi(kap, { satirAd, sutunAd, degerler, birim = "", ondalik = 0 } = {}) {
  kap = kap || el("div");
  const duz = degerler.flat().filter(Number.isFinite);
  const enk = Math.min(...duz), enb = Math.max(...duz);
  const RAMP = ["--r100","--r250","--r400","--r550","--r700"];
  const kova = v => {
    if (!Number.isFinite(v)) return null;
    const o = (v - enk) / ((enb - enk) || 1);
    return RAMP[Math.min(RAMP.length - 1, Math.floor(o * RAMP.length))];
  };
  const kt = kutucuk();
  const t = el("table", { stil:{ fontSize:"11px" } });
  t.append(el("thead", {}, el("tr", {}, el("th", { metin:"" }),
    sutunAd.map(a => el("th.s", { stil:{ padding:"2px 4px" }, metin:a })))));
  const gv = el("tbody");
  satirAd.forEach((sa, i) => {
    const tr = el("tr", {}, el("td", { stil:{ whiteSpace:"nowrap", fontWeight:"600" }, metin:sa }));
    sutunAd.forEach((su, j) => {
      const v = degerler[i]?.[j];
      const k = kova(v);
      const h = el("td", { stil:{ padding:"1px" } },
        el("div", { stil:{ height:"22px", borderRadius:"3px",
          background:k ? `var(${k})` : "var(--yuzey-2)",
          border:k ? "none" : "1px dashed var(--kilavuz)" } }));
      if (k) {
        h.addEventListener("mousemove", ev => kt.goster(ev,
          el("div", {}, el("b", { metin:`${sa} ${su}` }),
            el("div", { metin:`${say(v, ondalik)} ${birim}` }))));
        h.addEventListener("mouseleave", kt.gizle);
      }
      tr.append(h);
    });
    gv.append(tr);
  });
  t.append(gv);

  const olcek = el("div", { stil:{ display:"flex", alignItems:"center", gap:"7px",
    marginTop:"10px", fontSize:"11px" } },
    el("span.sessiz", { metin:`${kisa(enk, ondalik)} ${birim}` }),
    ...RAMP.map(r => el("span", { stil:{ width:"26px", height:"11px",
      background:`var(${r})`, display:"inline-block", borderRadius:"2px" } })),
    el("span.sessiz", { metin:`${kisa(enb, ondalik)} ${birim}` }));

  return sarmala(kap, el("div.tablo-sar", { stil:{ maxHeight:"none" } }, t), olcek,
    () => basitTablo(["", ...sutunAd], satirAd.map((sa, i) => [sa, ...degerler[i]])));
}

/* =============================================================== PARETO */
/**
 * Klasik Pareto ÇİFT EKSENLİDİR — yasak (5.7.2).
 * Kümülatif yüzde tablo sütununda gösterilir, %80 eşiği satır ayracıyla.
 */
function pareto(kap, { kalemler, birim = "", ondalik = 0 } = {}) {
  kap = kap || el("div");
  const sirali = [...kalemler].filter(k => Number.isFinite(k.deger) && k.deger > 0)
    .sort((a, b) => b.deger - a.deger);
  const toplam = sirali.reduce((t, k) => t + k.deger, 0);
  let birikim = 0;
  const satirlar = sirali.map(k => {
    birikim += k.deger;
    return { ...k, oran:k.deger / toplam, kumulatif:birikim / toplam };
  });
  const esikIndeks = satirlar.findIndex(s2 => s2.kumulatif >= 0.8);
  const enb = satirlar[0]?.deger || 1;

  const t = el("table");
  t.append(el("thead", {}, el("tr", {},
    el("th", { metin:"Kalem" }), el("th.s", { metin:`Değer (${birim})` }),
    el("th", { metin:"" }), el("th.s", { metin:"Pay" }), el("th.s", { metin:"Kümülatif" }))));
  const gv = el("tbody");
  satirlar.forEach((r, i) => {
    const tr = el("tr", {},
      el("td", { metin:r.ad }),
      el("td.s", { metin:say(r.deger, ondalik) }),
      el("td", { stil:{ width:"46%" } },
        el("div", { stil:{ height:"13px", borderRadius:"3px", background:"var(--s1)",
          width:(r.deger / enb * 100).toFixed(1) + "%" } })),
      el("td.s", { metin:"%" + say(r.oran * 100, 1) }),
      el("td.s", { metin:"%" + say(r.kumulatif * 100, 1) }));
    gv.append(tr);
    if (i === esikIndeks)
      gv.append(el("tr", {}, el("td", { colspan:5, stil:{ padding:"3px 10px",
        borderTop:"2px solid var(--ciddi)", background:"var(--yuzey-2)",
        fontSize:"11px", color:"var(--ink-2)" },
        metin:`▲ Buraya kadar olan ${i + 1} kalem toplamın %80'ini oluşturuyor` })));
  });
  t.append(gv);
  kap.append(el("div.tablo-sar", { stil:{ maxHeight:"none" } }, t));
  return kap;
}

/* =============================================================== SANKEY */
/** @param dugumler [{kod, ad, katman}] · akislar [{kaynak, hedef, deger}] */
function sankey(kap, { dugumler, akislar, birim = "", boy = 380 } = {}) {
  kap = kap || el("div");
  const en = Math.max(360, (kap.clientWidth || 860) - 4);
  const svg = s("svg", { width:en, height:boy, viewBox:`0 0 ${en} ${boy}`,
    style:"display:block;max-width:100%" });
  const kt = kutucuk();

  const katmanlar = [...new Set(dugumler.map(d => d.katman))].sort((a, b) => a - b);
  const kx = new Map(katmanlar.map((k, i) =>
    [k, 130 + i * ((en - 260) / Math.max(1, katmanlar.length - 1))]));

  const buyukluk = new Map();
  for (const d of dugumler) {
    const giren = akislar.filter(a => a.hedef === d.kod).reduce((t, a) => t + a.deger, 0);
    const cikan = akislar.filter(a => a.kaynak === d.kod).reduce((t, a) => t + a.deger, 0);
    buyukluk.set(d.kod, Math.max(giren, cikan));
  }
  const enbKatman = Math.max(...katmanlar.map(k =>
    dugumler.filter(d => d.katman === k).reduce((t, d) => t + buyukluk.get(d.kod), 0)));
  const olcek = (boy - 60) / (enbKatman || 1);

  const kutu = new Map();
  for (const k of katmanlar) {
    const grup = dugumler.filter(d => d.katman === k);
    const toplamBoy = grup.reduce((t, d) => t + buyukluk.get(d.kod) * olcek, 0);
    let y = (boy - toplamBoy - (grup.length - 1) * 10) / 2;
    for (const d of grup) {
      const h = Math.max(3, buyukluk.get(d.kod) * olcek);
      kutu.set(d.kod, { x:kx.get(k), y, h, d });
      y += h + 10;
    }
  }

  // akışlar (önce, düğümlerin altında kalsın)
  const kaynakOfset = new Map(), hedefOfset = new Map();
  for (const a of [...akislar].sort((x, y2) => y2.deger - x.deger)) {
    const k = kutu.get(a.kaynak), h = kutu.get(a.hedef);
    if (!k || !h || !(a.deger > 0)) continue;
    const kh = a.deger * olcek;
    const ko = kaynakOfset.get(a.kaynak) || 0, ho = hedefOfset.get(a.hedef) || 0;
    const x1 = k.x + 96, x2 = h.x;
    const y1 = k.y + ko, y2 = h.y + ho;
    const om = (x1 + x2) / 2;
    const yol = `M${x1},${y1} C${om},${y1} ${om},${y2} ${x2},${y2} ` +
                `L${x2},${y2 + kh} C${om},${y2 + kh} ${om},${y1 + kh} ${x1},${y1 + kh} Z`;
    const p = s("path", { d:yol, fill:a.renk || renk(a.slot ?? 0), opacity:.32 });
    p.addEventListener("mousemove", ev => { p.setAttribute("opacity", .55);
      kt.goster(ev, el("div", {}, el("b", { metin:`${k.d.ad} → ${h.d.ad}` }),
        el("div", { metin:`${say(a.deger, 0)} ${birim}` }))); });
    p.addEventListener("mouseleave", () => { p.setAttribute("opacity", .32); kt.gizle(); });
    svg.append(p);
    kaynakOfset.set(a.kaynak, ko + kh); hedefOfset.set(a.hedef, ho + kh);
  }

  for (const [kod, k] of kutu) {
    svg.append(s("rect", { x:k.x, y:k.y, width:96, height:k.h, rx:3,
      fill:k.d.renk || "var(--ink-mut)", opacity:.9 }));
    svg.append(s("text", { x:k.x + 48, y:k.y + k.h / 2 + 4, "text-anchor":"middle",
      fill:"var(--yuzey)", "font-size":10, "font-weight":600,
      style:"paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px" },
      document.createTextNode(k.d.ad.length > 15 ? k.d.ad.slice(0, 14) + "…" : k.d.ad)));
    svg.append(s("text", { x:k.x + 48, y:k.y - 4, "text-anchor":"middle",
      fill:"var(--ink-mut)", "font-size":9 },
      document.createTextNode(kisa(buyukluk.get(kod), 1))));
  }

  return sarmala(kap, svg, null,
    () => basitTablo(["Kaynak","Hedef",`Değer (${birim})`],
      akislar.map(a => [kutu.get(a.kaynak)?.d.ad || a.kaynak,
                        kutu.get(a.hedef)?.d.ad || a.hedef, a.deger])));
}


/* ============================================================== DAĞILIM */
/**
 * Dağılım + regresyon doğrusu (8.3).
 * TÜM-ÇİFTLER kuralı: dağılım grafiğinde en fazla 3 seri (5.7.1).
 * @param seriler [{ad, noktalar:[{x,y,etiket}]}]
 * @param dogru   {a, b, r2, n, zayif} — regresyon
 */
function dagilim(kap, { seriler, dogru = null, xAd = "", yAd = "",
                               boy = 320, baslik = "" } = {}) {
  kap = kap || el("div");
  if (seriler.length > 3) seriler = seriler.slice(0, 3);   // tüm-çiftler kapağı
  const { svg, ic } = iskelet(kap, { boy, baslik });
  const hepsi = seriler.flatMap(d => d.noktalar);
  if (!hepsi.length) { kap.append(el("p.sessiz", { metin:"Veri yok." })); return kap; }

  const xo = eksen(Math.min(...hepsi.map(p => p.x)), Math.max(...hepsi.map(p => p.x)));
  const yo = eksen(Math.min(...hepsi.map(p => p.y)), Math.max(...hepsi.map(p => p.y)));
  ykilavuz(svg, ic, yo, yAd, 0);

  const px = v => ic.x + ((v - xo.alt) / (xo.ust - xo.alt)) * ic.en;
  const py = v => ic.y + ic.boy - ((v - yo.alt) / (yo.ust - yo.alt)) * ic.boy;

  for (const t of xo.ticks) {
    svg.append(s("text", { x:px(t), y:ic.y + ic.boy + 15, "text-anchor":"middle",
      fill:"var(--ink-mut)", "font-size":10 }, document.createTextNode(kisa(t, 1))));
  }
  svg.append(s("text", { x:ic.x + ic.en, y:ic.y + ic.boy + 30, "text-anchor":"end",
    fill:"var(--ink-mut)", "font-size":10 }, document.createTextNode(xAd)));

  if (dogru && Number.isFinite(dogru.a)) {
    const x1 = xo.alt, x2 = xo.ust;
    svg.append(s("line", { x1:px(x1), y1:py(dogru.a * x1 + dogru.b),
      x2:px(x2), y2:py(dogru.a * x2 + dogru.b),
      stroke:"var(--ink-2)", "stroke-width":2, opacity:.75 }));
  }

  const kt = kutucuk();
  seriler.forEach((d, j) => {
    for (const p of d.noktalar) {
      const c = s("circle", { cx:px(p.x).toFixed(1), cy:py(p.y).toFixed(1), r:4,
        fill:d.renk || renk(j), stroke:"var(--yuzey)", "stroke-width":1.5, opacity:.9 });
      c.addEventListener("mousemove", ev => kt.goster(ev,
        el("div", {}, el("b", { metin:p.etiket || d.ad }),
          el("div", { metin:`${xAd}: ${say(p.x, 0)}` }),
          el("div", { metin:`${yAd}: ${say(p.y, 0)}` }))));
      c.addEventListener("mouseleave", kt.gizle);
      svg.append(c);
    }
  });

  const alt = el("div", {});
  if (dogru && Number.isFinite(dogru.a)) {
    alt.append(el("div.kucuk", { stil:{ marginTop:"8px", fontFamily:"ui-monospace,monospace" },
      metin:`beklenen = ${say(dogru.a, 4)} × ${xAd} + ${say(dogru.b, 0)}   ·   R² = ${say(dogru.r2, 2)}   ·   n = ${dogru.n}` }));
  }
  return sarmala(kap, svg, el("div", {}, aciklama(seriler), alt),
    () => basitTablo(["Nokta", xAd, yAd],
      seriler.flatMap(d => d.noktalar.map(p => [p.etiket || d.ad, p.x, p.y]))));
}
