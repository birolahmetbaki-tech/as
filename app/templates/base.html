<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Enerji İzleme{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% block layout %}
  <header class="topbar">
    <a class="brand" href="/">{{ factory_name }} · Enerji İzleme</a>
    <nav>
      <a href="/">Panel</a>
      <a href="/tanimlar/bolumler">Bölümler</a>
      <a href="/tanimlar/enerji-turleri">Enerji Türleri</a>
      <a href="/tanimlar/sayaclar">Sayaçlar</a>
      <a href="/okumalar">Okumalar</a>
      <a href="/uretim">Üretim</a>
      <a href="/hedefler">Hedefler</a>
    </nav>
    <form method="post" action="/cikis"><button class="link" type="submit">Çıkış</button></form>
  </header>
  <main class="content">
    {% for message in flash_messages %}<p class="notice">{{ message }}</p>{% endfor %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
